<!-- Encabezado de la Página - Solo para /servicios -->
@if (isPage) {
  <div class="services-page-header">
    <div class="services-page-overlay"></div>
    <div class="services-page-content">
      <h1>Our Services</h1>
      <p>Underground Infrastructure Solutions Built to Last</p>
    </div>
  </div>
}

<section class="services-section">
  <div class="services-container">

    <!-- Cards -->
    <div class="services-list">
      @for (service of services; track service.number) {
       <div class="service-card" [class.service-card--reverse]="service.reverse">

  <div class="service-image-wrap">
    <img [src]="service.image" [alt]="service.title" class="service-image" loading="lazy">
    <div class="service-glow"></div>
    <div class="service-glow-inner"></div>
    <i class="ti {{ service.icon }} service-icon-overlay" aria-hidden="true"></i>
    <span class="service-number">Service {{ service.number }}</span>
  </div>

       <div class="service-content" [class.service-content--reverse]="service.reverse">
    <h3 class="service-title">{{ service.title }}</h3>
    <p class="service-desc">{{ service.description }}</p>
    <div class="service-link">
      <span>Learn more</span>
      <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </div>
  </div>

        </div>
      }
    </div>

  </div>
</section>

<!-- Formulario de contacto solo en la pagina /servicios -->
@if (isPage) {
  <div>
    <app-contacto [showHeader]="false"></app-contacto>
  </div>
}
