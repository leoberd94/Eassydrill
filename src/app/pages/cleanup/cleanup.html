<section class="section">
  <div class="section-label">OUR COMMITMENT</div>
  <h2 class="section-title">SITE CLEANUP & RESTORATION</h2>
  <div class="title-bar"></div>
  <p class="section-desc">
    After completing the project, we ensure the work area is properly cleaned
    and organized, minimizing disruption and maintaining a professional finish.
  </p>
  <div class="cards">
    @for (item of items; track item.title) {
      <div class="card">
        <div class="card-icon">
          <i [class]="item.icon" aria-hidden="true"></i>
        </div>
        <h3>{{ item.title }}</h3>
        <p>{{ item.desc }}</p>
      </div>
    }
  </div>
</section>
