<section class="workflow-section">
  <div class="workflow-container">

    <div class="workflow-header">
      <p class="workflow-tag">How We Work</p>
      <h2 class="workflow-title">Project Workflow</h2>
      <div class="workflow-line"></div>
    </div>

    <div class="workflow-list">
      @for (step of steps; track step.number; let i = $index) {
        <div
          #cardRef
          class="workflow-card"
          [style.--delay]="(i * 100) + 'ms'">

          <!-- Ícono + título en la misma fila -->
          <div class="workflow-icon-wrap">
            <i class="ti {{ step.icon }}" aria-hidden="true"></i>
            <span class="workflow-icon-title">{{ step.title }}</span>
          </div>

          <!-- Descripción -->
          <div class="workflow-content">
            <p class="workflow-step-desc">{{ step.description }}</p>
          </div>

        </div>
      }
    </div>

  </div>
</section>
